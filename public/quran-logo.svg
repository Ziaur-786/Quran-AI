<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F4C36"/>
      <stop offset="100%" stop-color="#061e15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5E096"/>
      <stop offset="50%" stop-color="#C5A059"/>
      <stop offset="100%" stop-color="#8B6914"/>
    </linearGradient>
    <linearGradient id="pageGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF7"/>
      <stop offset="100%" stop-color="#F1E7D0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1" flood-color="#000000" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Circular Base with Islamic Green and Gold Border -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="27.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.7" stroke-dasharray="2,2" opacity="0.7"/>

  <!-- Crescent & Star at the Top -->
  <path d="M 31 9.5 A 4 4 0 1 1 33.8 15 A 3.2 3.2 0 1 0 31 9.5 Z" fill="url(#goldGrad)"/>
  <polygon points="35,11.5 35.7,12.8 37.2,13 36.1,14.1 36.4,15.5 35,14.8 33.6,15.5 33.9,14.1 32.8,13 34.3,12.8" fill="url(#goldGrad)"/>

  <!-- Quran Book (Open Pages) -->
  <g filter="url(#glow)">
    <!-- Book Outer Cover Border (Under pages) -->
    <path d="M 32 46.5 C 25.5 44 18 43 11 45.5 L 11 21.5 C 18 19 25.5 20.2 32 23.5 C 38.5 20.2 46 19 53 21.5 L 53 45.5 C 46 43 38.5 44 32 46.5 Z" fill="#8B6914"/>

    <!-- Book Left Side Page Layers -->
    <path d="M 32 45 C 26 43 19 42 12.5 44 L 12.5 21 C 19 19 26 20 32 23 Z" fill="#E6D7BA"/>
    <!-- Book Left Top Page -->
    <path d="M 32 44 C 26 42 19.5 41.2 13.5 43 L 13.5 20.5 C 19.5 18.7 26 19.5 32 22.5 Z" fill="url(#pageGrad)"/>

    <!-- Book Right Side Page Layers -->
    <path d="M 32 45 C 38 43 45 42 51.5 44 L 51.5 21 C 45 19 38 20 32 23 Z" fill="#DCB672"/>
    <!-- Book Right Top Page -->
    <path d="M 32 44 C 38 42 44.5 41.2 50.5 43 L 50.5 20.5 C 44.5 18.7 38 19.5 32 22.5 Z" fill="url(#pageGrad)"/>

    <!-- Gold Borders for Pages -->
    <path d="M 32 44 C 26 42 19.5 41.2 13.5 43 L 13.5 20.5 C 19.5 18.7 26 19.5 32 22.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>
    <path d="M 32 44 C 38 42 44.5 41.2 50.5 43 L 50.5 20.5 C 44.5 18.7 38 19.5 32 22.5" fill="none" stroke="url(#goldGrad)" stroke-width="0.8"/>

    <!-- Quranic Calligraphy / Ayah lines simulation -->
    <!-- Left page text lines -->
    <line x1="17" y1="25.5" x2="28" y2="27" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <line x1="17" y1="29.5" x2="28" y2="31" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <line x1="17" y1="33.5" x2="28" y2="35" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <line x1="17" y1="37.5" x2="25" y2="38.5" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>

    <!-- Right page text lines -->
    <line x1="36" y1="27" x2="47" y2="25.5" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <line x1="36" y1="31" x2="47" y2="29.5" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <line x1="36" y1="35" x2="47" y2="33.5" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>
    <line x1="39" y1="38.5" x2="47" y2="37.5" stroke="url(#goldGrad)" stroke-width="1.1" stroke-linecap="round" opacity="0.85"/>

    <!-- Center Fold Spine -->
    <line x1="32" y1="22.5" x2="32" y2="44" stroke="#8B6914" stroke-width="1.5"/>

    <!-- Hanging Gold Ribbon Bookmark -->
    <path d="M 32 44 Q 31 51 28 53.5 L 32 49.5 L 36 53.5 Q 33 51 32 44" fill="url(#goldGrad)"/>
  </g>
</svg>
